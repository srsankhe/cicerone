# End-to-end tests: drive the shinytest2 fixture app through a real
# headless Chrome (ubuntu runners ship Chrome; chromote finds it).
on:
  push:
    branches: [main, master]
  pull_request:

name: e2e.yaml

permissions: read-all

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      CICERONE_E2E: "true"

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::shinytest2, any::rcmdcheck
          needs: check

      - name: Install cicerone
        run: R CMD INSTALL .

      - name: Run end-to-end tests
        run: |
          testthat::test_local(
            filter = "e2e",
            reporter = "summary",
            stop_on_failure = TRUE
          )
        shell: Rscript {0}
